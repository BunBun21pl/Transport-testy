<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Testy – gałęzie transportu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7fafa; --card:#ffffff; --ink:#14313a; --muted:#5b7179; --line:#dbe5e7;
  --teal:#0f6e7a; --teal-soft:#e3f1f3; --ok:#2c7a3c; --ok-soft:#e6f4e9; --bad:#b0392f; --bad-soft:#fbe8e6;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0f1a1d; --card:#17262a; --ink:#e4eef0; --muted:#94aab0; --line:#2a3d42;
  --teal:#4fb3c0; --teal-soft:#1b3539; --ok:#6cc47e; --ok-soft:#1b3423; --bad:#ef8a80; --bad-soft:#3a2120; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0f1a1d; --card:#17262a; --ink:#e4eef0; --muted:#94aab0; --line:#2a3d42;
  --teal:#4fb3c0; --teal-soft:#1b3539; --ok:#6cc47e; --ok-soft:#1b3423; --bad:#ef8a80; --bad-soft:#3a2120; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:20px 18px 40px}
h1{font-size:1.65rem;line-height:1.15;margin:8px 0 6px;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 18px}
.route{display:flex;align-items:center;gap:0;margin:18px 0 22px}
.route i{flex:1;height:4px;background:var(--line);border-radius:2px}
.route b{width:14px;height:14px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px currentColor;background:currentColor;flex:none}
.sect{font-weight:600;margin:18px 0 8px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.chip small{color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 18px;font:inherit;font-weight:600;font-size:1.02rem;cursor:pointer;background:var(--teal);color:#fff;margin-top:12px}
:root[data-theme="dark"] .btn{color:#0f1a1d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0f1a1d}}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.stat{display:flex;gap:10px;margin-top:16px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat strong{display:block;font-size:1.3rem}
.stat span{color:var(--muted);font-size:.82rem}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem}
.top button{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:4px 0}
.track{display:flex;gap:4px;margin:10px 0 20px}
.track span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track span.ok{background:var(--ok)} .track span.bad{background:var(--bad)} .track span.now{background:var(--teal)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card));padding:3px 10px;border-radius:999px}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.q{font-size:1.2rem;font-weight:600;line-height:1.35;margin:12px 0 16px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 14px;font:inherit;font-size:.98rem;cursor:pointer;display:flex;gap:11px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.why{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--teal-soft);font-size:.93rem}
.why b{display:block;margin-bottom:2px}
.score{font-size:4.2rem;font-weight:700;line-height:1;margin:18px 0 4px;letter-spacing:-.03em}
.score small{font-size:1.6rem;color:var(--muted);font-weight:500}
.verdict{font-size:1.1rem;font-weight:600;margin:0 0 4px}
.review{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.rv{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:11px 13px;font-size:.92rem}
.rv p{margin:6px 0 0}
.rv .you{color:var(--bad)} .rv .good{color:var(--ok);font-weight:600}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){ .pop{animation:pop .25s ease-out} @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<main id="app"></main>
<script>
const Q=[
// KLASYFIKACJA
["k","Ile gałęzi transportu wyróżnia się ze względu na specyfikę drogi transportowej?","6","4","5","8","Kolejowy, samochodowy, lotniczy, wodny śródlądowy, morski i przesyłowy."],
["k","Co jest kryterium podziału w klasyfikacji pionowej transportu?","Środowisko (droga transportowa) i sposób przemieszczania się środka transportu","Przedmiot przewozu","Odległość przewozu","Forma własności","Klasyfikacja pionowa dzieli transport na gałęzie według środowiska i drogi."],
["k","Klasyfikacja pionowa dzieli transport na:","gałęzie","rodzaje","systemy","technologie","Pionowa = gałęzie, pozioma = rodzaje."],
["k","Klasyfikacja pozioma dzieli transport na:","rodzaje","gałęzie","środowiska","sieci","Pozioma = rodzaje (według różnych kryteriów)."],
["k","Ze względu na środowisko wyróżnia się transport:","lądowy, wodny, powietrzny","krajowy, międzynarodowy","regularny, nieregularny","publiczny, branżowy, własny","To trzy środowiska ruchu."],
["k","W aspekcie przedmiotowym transport to:","proces technologiczny przemieszczania osób, przedmiotów lub energii za pomocą środków transportu","wydzielone ekonomicznie celowe przemieszczanie ładunków i osób","przewóz na podstawie umowy z klientem","przewóz realizowany według rozkładu jazdy","Aspekt przedmiotowy = proces technologiczny."],
["k","W aspekcie podmiotowym transport to:","technicznie, organizacyjnie i ekonomicznie wydzielone celowe przemieszczanie ładunków i osób","proces technologiczny przemieszczania energii","przewóz bez przeładunku","przewóz w tej samej jednostce ładunkowej","Aspekt podmiotowy = działalność wydzielona technicznie, organizacyjnie i ekonomicznie."],
["k","Transport regularny to transport realizowany:","według rozkładu jazdy podanego do publicznej wiadomości","na zamówienie klienta","bez przeładunku","jednym środkiem transportu","Regularny = rozkład jazdy znany publicznie."],
["k","Transport nieregularny jest realizowany:","na zamówienie, na podstawie umowy zawartej z klientem","według stałego rozkładu jazdy","tylko w transporcie lotniczym","wyłącznie przez przedsiębiorstwa państwowe","Nieregularny = w momencie wystąpienia konkretnego zapotrzebowania."],
["k","Transport bezpośredni to transport:","realizowany jednym środkiem transportu bez przeładunku","z wykorzystaniem co najmniej dwóch środków transportu","z udziałem dwóch gałęzi transportu","realizowany na zamówienie","Bezpośredni = jeden środek, brak przeładunku."],
["k","Transport pośredni wiąże się z:","przeładunkiem – wykorzystaniem co najmniej dwóch środków transportu","brakiem przeładunku","jednym środkiem transportu na całej trasie","przewozem tylko osób","Pośredni = min. 2 środki, więc jest przeładunek."],
["k","Transport łamany to przewóz z zastosowaniem co najmniej dwóch środków transportu:","należących do jednej gałęzi transportu","należących do różnych gałęzi transportu","w tej samej jednostce ładunkowej","wyłącznie kolejowych i morskich","Łamany = ta sama gałąź, np. dwie ciężarówki."],
["k","Transport multimodalny to przewóz za pośrednictwem:","co najmniej dwóch gałęzi transportu","jednego środka transportu","dwóch środków tej samej gałęzi","wyłącznie rurociągów","Multimodalny = min. 2 gałęzie."],
["k","Który rodzaj transportu polega na przewozie ładunków w tych samych jednostkach ładunkowych (np. kontenerach) różnymi gałęziami?","intermodalny","łamany","bezpośredni","branżowy","Intermodalny = ta sama jednostka ładunkowa na całej trasie."],
["k","W transporcie kombinowanym dowóz i odwóz realizuje zwykle transport:","samochodowy","lotniczy","przesyłowy","morski","Główna trasa: kolej, żegluga lub samolot; dowóz i odwóz: samochód."],
["k","Transport kombinowany zalicza się do transportu:","intermodalnego","łamanego","bezpośredniego","przesyłowego","Kombinowany to odmiana intermodalnego."],
["k","Ze względu na zasięg geograficzny transport dzieli się na:","krajowy i międzynarodowy","regularny i nieregularny","bezpośredni i pośredni","publiczny i własny","Zasięg geograficzny = krajowy / międzynarodowy."],
["k","Transport międzynarodowy dzieli się na:","kontynentalny i międzykontynentalny","miejski i podmiejski","regionalny i międzyregionalny","zakładowy i osiedlowy","Pozostałe odpowiedzi to odmiany transportu krajowego."],
["k","Który z wymienionych jest odmianą transportu krajowego?","międzywojewódzki","międzykontynentalny","kontynentalny","transoceaniczny","Krajowy: zakładowy, osiedlowy, miejski, podmiejski, regionalny, międzywojewódzki itd."],
["k","Ze względu na odległość przewozu wyróżnia się transport:","bliskiego, średniego i dalekiego zasięgu","krajowy i międzynarodowy","lądowy, wodny i powietrzny","osób i ładunków","Kryterium odległości = zasięg bliski/średni/daleki."],
["k","Transport publiczny to transport, w którym usługi:","świadczone są każdemu, kto zapłaci przewidzianą opłatę","świadczone są nieodpłatnie dla własnej firmy","świadczone są tylko dla określonej branży","realizowane są tylko przez kolej","Publiczny = dostępny dla każdego."],
["k","Transport branżowy to usługi przewozowe świadczone:","odpłatnie, specjalistycznym taborem, dla odbiorców z określonej branży","każdemu, kto zapłaci","nieodpłatnie na rzecz własnego przedsiębiorstwa","wyłącznie dla osób prywatnych","Branżowy = wyspecjalizowany tabor dla danej branży."],
["k","Na transport własny składają się:","transport gospodarczy i transport indywidualny","transport publiczny i branżowy","transport krajowy i międzynarodowy","transport regularny i nieregularny","Gospodarczy = nieodpłatne przewozy własnymi środkami na rzecz własnej firmy."],

["k","Ze względu na przedmiot przewozu wyróżnia się transport:","osób i ładunków","krajowy i międzynarodowy","zarobkowy i niezarobkowy","lądowy i wodny","Przedmiot przewozu = co wieziemy."],
["k","Jak nazywa się polska miejscowość, w której przeładowuje się większość towarów z Chin na Nowym Jedwabnym Szlaku?","Małaszewicze","Gdynia","Kutno","Sławków","Małaszewicze to jeden z największych „suchych” portów w Europie."],
["k","Nowy Jedwabny Szlak to przykład transportu:","międzynarodowego kolejowego na duże odległości","krajowego samochodowego","śródlądowego","lotniczego regionalnego","To sieć połączeń kolejowych Chiny–Europa."],
// SAMOCHODOWY
["s","Transport drogowy polega na przewożeniu osób lub towarów:","kołowymi środkami transportu po drogach lądowych","po torach kolejowych","statkami powietrznymi","rurociągami","Definicja z podręcznika."],
["s","Która gałąź transportu jest najbardziej rozpowszechniona w Polsce i Europie?","samochodowa","kolejowa","morska","śródlądowa","Ze względu na ogólną dostępność to główny sposób wykonywania przewozów."],
["s","Od czego ściśle zależy efektywność transportu samochodowego?","od stanu dróg i infrastruktury","od stanu wód","od warunków w porcie lotniczym","od przepustowości rurociągów","Ważne są drogi, punkty przeładunkowe i centra logistyczne."],
["s","Która ustawa wprowadza podział transportu drogowego na krajowy i międzynarodowy?","Ustawa z 6 września 2001 r. o transporcie drogowym","Ustawa z 3 lipca 2002 r. Prawo lotnicze","Krajowy Program Kolejowy","Kodeks morski","Art. 4 ustawy o transporcie drogowym."],
["s","Międzynarodowy transport drogowy to przewóz, w którym jazda między miejscem początkowym a docelowym odbywa się:","z przekroczeniem granicy Rzeczypospolitej Polskiej","wyłącznie po autostradach","tylko w obrębie jednego województwa","bez użycia przyczepy","Kluczowe jest przekroczenie granicy RP."],
["s","Krajowy transport drogowy wymaga, aby pojazdy były:","zarejestrowane w kraju, a cała trasa przebiegała na terytorium RP","zarejestrowane za granicą","wyposażone w kontenery","przewożone koleją","Start, koniec i droga przejazdu – w RP."],
["s","Ze względu na działalność gospodarczą transport drogowy dzieli się na:","zarobkowy i niezarobkowy","krajowy i międzynarodowy","osób i ładunków","regularny i nieregularny","Kryterium: ekonomiczna forma prowadzenia działalności."],
["s","Co oznacza dostawa typu door-to-door?","dostawę od drzwi nadawcy do drzwi odbiorcy","dostawę tylko do portu","dostawę z przeładunkiem w terminalu","dostawę wyłącznie koleją","Door-to-door to zaleta transportu samochodowego."],
["s","Która cecha jest ZALETĄ transportu samochodowego?","najlepsza dostępność przestrzenna","duża ładowność","brak zanieczyszczeń","możliwość przewozów międzykontynentalnych","Gęsta i spójna sieć dróg."],
["s","Która cecha jest WADĄ transportu samochodowego?","wysoki współczynnik wypadkowości","mała dostępność przestrzenna","brak możliwości dostaw door-to-door","bardzo niska prędkość","Inne wady: zanieczyszczenie, korki, mała ładowność."],
["s","Transport samochodowy ma stosunkowo:","małą ładowność środków transportu","największą ładowność ze wszystkich gałęzi","największą prędkość ze wszystkich gałęzi","najniższe koszty przewozu","Mała ładowność to jedna z wad."],
["s","Czego NIE umożliwia transport samochodowy?","transportu międzykontynentalnego","dowozu do innych gałęzi transportu","przewozu osób na krótkie odległości","dostaw door-to-door","Brak transportu międzykontynentalnego to wada."],
["s","Transport samochodowy dobrze nadaje się do:","przewozu osób na krótkich odległościach","przewozu ropy na tysiące kilometrów","przewozu masowego zboża przez ocean","przesyłu energii elektrycznej","To jedna z zalet tej gałęzi."],

["s","Jakie zjawisko jest skutkiem słabo rozwiniętej infrastruktury drogowej?","kongestia (zatory), uszkodzenia dróg i kolizje","zamarzanie dróg wodnych","przerwy w przesyle gazu","spadek prędkości samolotów","Zwiększa się natężenie ruchu na odcinkach tras."],
["s","Podstawowym środkiem transportu towarowego w przewozach drogowych są:","ciężkie samochody i przyczepy","autobusy","busy osobowe","motocykle","Ich użycie wymaga dobrej jakości sieci dróg."],
["s","Najbardziej znana droga rzymska z III w. p.n.e. to:","Via Appia","Via Baltica","Droga Bursztynowa","Via Carpatia","Ciekawostka z rozdziału o transporcie drogowym."],

["ko","Kolej międzyregionalna to inaczej kolej:","dalekobieżna","podmiejska","przemysłowa","linowa","Kolej międzyregionalna (dalekobieżna)."],

["in","Jaka zmiana dotycząca ubezpieczenia pojawiła się w Incoterms 2020?","w CIP wymagany jest wyższy zakres ubezpieczenia (klauzula A), a w CIF nadal minimalny (klauzula C)","zniesiono obowiązek ubezpieczenia w CIF","ubezpieczenie jest obowiązkowe we wszystkich regułach","ubezpieczenie przejęło FOB","Klauzula A = ochrona od wszystkich ryzyk."],

["in","Polska firma sprzedaje meble do Niemiec i chce, żeby kupujący odebrał je z jej magazynu i sam wszystkim się zajął. Która reguła pasuje?","EXW","DDP","CIP","DPU","Minimum obowiązków sprzedającego."],
["in","Sprzedający ma dostarczyć towar pod drzwi klienta w Czechach, rozładować go i nie zajmuje się cłem. Która reguła pasuje?","DPU","DAP","DDP","FCA","DAP – bez rozładunku; DDP – z cłem."],
["in","Eksporter opłaca fracht morski i ubezpieczenie do portu w Rotterdamie, a ryzyko przechodzi w Gdańsku po załadunku. Która reguła?","CIF","CFR","FOB","DAP","Koszt, ubezpieczenie i fracht."],
["in","Przyporządkuj regułę do grupy E:","EXW","FCA","CPT","DAP","Grupa E ma tylko jedną regułę."]
];

const TOPICS={
  k:{n:"Klasyfikacja",c:"#0f6e7a"}, s:{n:"Samochodowy",c:"#c96a12"}, ko:{n:"Kolejowy",c:"#7b4bb0"},
  l:{n:"Lotniczy",c:"#1f6fb8"}, m:{n:"Morski",c:"#145a9c"}, w:{n:"Śródlądowy",c:"#2b8a6e"},
  p:{n:"Przesyłowy",c:"#8a6532"}, i:{n:"Intermodalny",c:"#b8336a"}, c:{n:"Porównania",c:"#4a6a73"}, pr:{n:"Prawo transportowe",c:"#6b7a1f"}, in:{n:"Incoterms 2020",c:"#3f51b5"}
};
const PER_TEST=10;
const app=document.getElementById('app');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let selected=new Set(Object.keys(TOPICS));
let wrongIds=new Set(store.get('wrong',[]));
let used=new Set(store.get('used',[]));
let stats=store.get('stats',{tests:0,best:0});
let test=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function save(){store.set('wrong',[...wrongIds]);store.set('used',[...used]);store.set('stats',stats)}

function pick(mode){
  let pool=Q.map((q,i)=>i).filter(i=>selected.has(Q[i][0]));
  if(mode==='wrong') pool=[...wrongIds].filter(i=>Q[i]);
  if(mode!=='wrong'){
    let fresh=pool.filter(i=>!used.has(i));
    if(fresh.length<PER_TEST){ pool.forEach(i=>used.delete(i)); fresh=pool.slice(); }
    pool=fresh;
  }
  const ids=shuffle(pool).slice(0,PER_TEST);
  return ids.map(i=>{const q=Q[i];const opts=shuffle([q[2],q[3],q[4],q[5]]);return{id:i,t:q[0],q:q[1],opts,correct:opts.indexOf(q[2]),why:q[6],ans:null}});
}

function home(){
  const avail=Q.filter(q=>selected.has(q[0])).length;
  const usedIn=Q.reduce((n,q,i)=>n+(selected.has(q[0])&&used.has(i)?1:0),0);
  app.innerHTML=`<div class="pop">
  <div class="route" style="color:var(--teal)"><b style="color:#c96a12"></b><i></i><b style="color:#7b4bb0"></b><i></i><b style="color:#1f6fb8"></b><i></i><b style="color:#145a9c"></b><i></i><b style="color:#b8336a"></b></div>
  <h1>Testy z transportu</h1>
  <p class="lead">${Q.length} pytań: gałęzie transportu (rozdz. 8–15), prawo transportowe i Incoterms 2020. Każdy test to ${PER_TEST} losowych pytań. Pytania nie powtarzają się, dopóki nie przejdziesz całej puli.</p>
  <div class="sect">Tematy</div>
  <div class="chips" id="chips">${Object.entries(TOPICS).map(([k,t])=>`<button class="chip" style="--c:${t.c}" data-k="${k}" aria-pressed="${selected.has(k)}"><span class="dot"></span>${t.n} <small>${Q.filter(q=>q[0]===k).length}</small></button>`).join('')}</div>
  <button class="btn" id="go" ${avail<1?'disabled':''}>Rozpocznij test – ${Math.min(PER_TEST,avail)} pytań</button>
  ${wrongIds.size?`<button class="btn ghost" id="redo">Powtórz moje błędy (${wrongIds.size})</button>`:''}
  <div class="stat">
    <div><strong>${usedIn}/${avail}</strong><span>przerobione z wybranych tematów</span></div>
    <div><strong>${stats.tests}</strong><span>rozwiązane testy</span></div>
    <div><strong>${stats.best}/10</strong><span>najlepszy wynik</span></div>
  </div></div>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
    if(selected.has(k)){ if(selected.size>1) selected.delete(k);} else selected.add(k); home();});
  document.getElementById('go').onclick=()=>start('normal');
  const r=document.getElementById('redo'); if(r) r.onclick=()=>start('wrong');
}

function start(mode){ test={mode,items:pick(mode),i:0}; if(!test.items.length) return home(); window.scrollTo(0,0); question(); }

function question(){
  const it=test.items[test.i], t=TOPICS[it.t], n=test.items.length;
  app.innerHTML=`<div class="pop">
  <div class="top"><span>Pytanie ${test.i+1} z ${n}</span><button id="quit">Zakończ</button></div>
  <div class="track">${test.items.map((x,j)=>`<span class="${x.ans===null?(j===test.i?'now':''):(x.ans===x.correct?'ok':'bad')}"></span>`).join('')}</div>
  <span class="tag" style="--c:${t.c}">${t.n}</span>
  <div class="q">${esc(it.q)}</div>
  <div class="opts">${it.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${"ABCD"[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="after"></div></div>`;
  document.getElementById('quit').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.j));
}

function answer(j){
  const it=test.items[test.i]; if(it.ans!==null) return; it.ans=j;
  const good=j===it.correct;
  used.add(it.id);
  if(good){ if(test.mode==='wrong') wrongIds.delete(it.id); } else wrongIds.add(it.id);
  save();
  app.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;
    if(k===it.correct) b.classList.add('ok'); else if(k===j) b.classList.add('bad'); else b.classList.add('dim');});
  const tr=app.querySelectorAll('.track span')[test.i]; tr.className=good?'ok':'bad';
  const last=test.i===test.items.length-1;
  document.getElementById('after').innerHTML=`<div class="why pop"><b style="color:${good?'var(--ok)':'var(--bad)'}">${good?'Dobrze!':'Źle. Poprawna odpowiedź: '+esc(it.opts[it.correct])}</b>${esc(it.why)}</div>
  <button class="btn" id="next">${last?'Zobacz wynik':'Następne pytanie'}</button>`;
  const nx=document.getElementById('next'); nx.focus({preventScroll:true});
  nx.scrollIntoView({block:'nearest',behavior:'smooth'});
  nx.onclick=()=>{ if(last) result(); else { test.i++; window.scrollTo(0,0); question(); } };
}

function result(){
  const n=test.items.length, ok=test.items.filter(x=>x.ans===x.correct).length;
  stats.tests++; if(n===PER_TEST) stats.best=Math.max(stats.best,ok); save();
  const pct=ok/n;
  const v=pct===1?'Bezbłędnie. Tak trzymaj!':pct>=.8?'Bardzo dobrze – prawie wszystko.':pct>=.6?'Nieźle, ale przejrzyj błędy.':pct>=.4?'Trzeba jeszcze powtórzyć.':'Wróć do notatki i spróbuj ponownie.';
  const bad=test.items.filter(x=>x.ans!==x.correct);
  app.innerHTML=`<div class="pop">
  <div class="score">${ok}<small> / ${n}</small></div>
  <p class="verdict">${v}</p>
  <div class="track">${test.items.map(x=>`<span class="${x.ans===x.correct?'ok':'bad'}"></span>`).join('')}</div>
  <button class="btn" id="again">Nowy test – ${PER_TEST} losowych pytań</button>
  ${wrongIds.size?`<button class="btn ghost" id="redo">Powtórz moje błędy (${wrongIds.size})</button>`:''}
  <button class="btn ghost" id="home">Wybierz tematy</button>
  ${bad.length?`<div class="sect" style="margin-top:26px">Twoje błędy</div><div class="review">${bad.map(x=>`<div class="rv" style="border-left-color:${TOPICS[x.t].c}"><b>${esc(x.q)}</b>
    <p class="you">Twoja odpowiedź: ${esc(x.opts[x.ans])}</p><p class="good">Poprawnie: ${esc(x.opts[x.correct])}</p><p>${esc(x.why)}</p></div>`).join('')}</div>`:''}
  </div>`;
  window.scrollTo(0,0);
  document.getElementById('again').onclick=()=>start('normal');
  document.getElementById('home').onclick=home;
  const r=document.getElementById('redo'); if(r) r.onclick=()=>start('wrong');
}
home();
</script>
</body>
</html>
